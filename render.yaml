services:
  - type: web
    name: sariwa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_BACKEND
        value: sqlite
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sariwa-web.onrender.com,http://localhost:4200,http://127.0.0.1:4200

  - type: web
    name: sariwa-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
